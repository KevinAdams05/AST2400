<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4f8"/>
    </linearGradient>
    <linearGradient id="entryGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="ackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">DDC I²C bit-bang via AST CR_B7</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#4a5568">EDID readback flow — ast_read_edid_block()</text>

  <!-- CR_B7 bit map -->
  <rect x="40" y="70" width="820" height="100" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="60" y="92" font-size="13" font-weight="700" fill="#78350f">CR_B7 — single register controls all four I²C lines</text>

  <text x="60" y="115" font-size="12" font-family="monospace" fill="#1a202c">bit 0 (write, inverted): drive SCL low — set=low, clear=release (pull-up brings high)</text>
  <text x="60" y="133" font-size="12" font-family="monospace" fill="#1a202c">bit 2 (write, inverted): drive SDA low — set=low, clear=release</text>
  <text x="60" y="151" font-size="12" font-family="monospace" fill="#1a202c">bit 4 (read):            current SCL line state — 1 = high, 0 = low</text>
  <text x="60" y="169" font-size="12" font-family="monospace" fill="#1a202c">bit 5 (read):            current SDA line state — 1 = high, 0 = low</text>

  <!-- Entry -->
  <rect x="320" y="190" width="260" height="36" rx="18" fill="url(#entryGrad)" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="213" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">ast_read_edid_block(buf)</text>

  <!-- Phase 1: bus idle -->
  <rect x="100" y="245" width="700" height="42" rx="8" fill="url(#boxGrad)" stroke="#a0aec0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="120" y="265" font-size="13" font-weight="600" fill="#1a202c">1. Bus idle</text>
  <text x="120" y="280" font-size="11" fill="#4a5568" font-family="monospace">i2c_set_scl(high); i2c_set_sda(high);  ← release both lines, pull-ups drive bus high</text>

  <!-- Phase 2: START -->
  <rect x="100" y="297" width="700" height="42" rx="8" fill="url(#boxGrad)" stroke="#a0aec0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="120" y="317" font-size="13" font-weight="600" fill="#1a202c">2. START condition</text>
  <text x="120" y="332" font-size="11" fill="#4a5568" font-family="monospace">SDA ↓ while SCL high  → SCL ↓        ← signal a transaction is starting</text>

  <!-- Phase 3: write addr+W -->
  <rect x="100" y="349" width="700" height="42" rx="8" fill="url(#dataGrad)" stroke="#1e3a8a" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="120" y="369" font-size="13" font-weight="600" fill="#1a202c">3. Send 0xA0 (EDID address 0x50 &lt;&lt; 1 | write)</text>
  <text x="120" y="384" font-size="11" fill="#4a5568" font-family="monospace">i2c_write_byte(0xA0)   ← 8 bits MSB-first, then read 9th-clock ACK from slave</text>

  <!-- ACK check -->
  <rect x="100" y="401" width="700" height="42" rx="8" fill="url(#ackGrad)" stroke="#92400e" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="120" y="421" font-size="13" font-weight="600" fill="#1a202c">4. Send register offset 0x00 (start of EDID)</text>
  <text x="120" y="436" font-size="11" fill="#4a5568" font-family="monospace">i2c_write_byte(0x00)   ← also ACK-checked</text>

  <!-- Phase 5: Repeated START -->
  <rect x="100" y="453" width="700" height="42" rx="8" fill="url(#boxGrad)" stroke="#a0aec0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="120" y="473" font-size="13" font-weight="600" fill="#1a202c">5. Repeated START + send 0xA1 (address | read)</text>
  <text x="120" y="488" font-size="11" fill="#4a5568" font-family="monospace">i2c_start(); i2c_write_byte(0xA1)  ← switch from write phase to read phase</text>

  <!-- Phase 6: read 128 bytes -->
  <rect x="100" y="505" width="700" height="42" rx="8" fill="url(#dataGrad)" stroke="#1e3a8a" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="120" y="525" font-size="13" font-weight="600" fill="#1a202c">6. Read 128 bytes (EDID base block)</text>
  <text x="120" y="540" font-size="11" fill="#4a5568" font-family="monospace">for i in 0..127: buf[i] = i2c_read_byte(ack = (i &lt; 127));  ← NACK on last byte</text>

  <!-- Phase 7: STOP -->
  <rect x="100" y="557" width="700" height="42" rx="8" fill="url(#boxGrad)" stroke="#a0aec0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="120" y="577" font-size="13" font-weight="600" fill="#1a202c">7. STOP condition</text>
  <text x="120" y="592" font-size="11" fill="#4a5568" font-family="monospace">SCL ↑, SDA ↑   ← bus returns to idle.  buf now contains the monitor's EDID.</text>

</svg>
